name: Mise à jour S&P 500
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cours du S&P 500
        run: python -u fetch_sp500.py
      - name: Publier sur la branche data (un seul commit, sans historique)
        run: |
          cp data/sp500.json /tmp/sp500.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-tmp
          git rm -rf . > /dev/null
          cp /tmp/sp500.json sp500.json
          git add sp500.json
          git commit -m "S&P 500"
          git push -f origin data-tmp:data
