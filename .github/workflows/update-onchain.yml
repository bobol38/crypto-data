name: Mise à jour on-chain
on:
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcul MVRV et récapitulatif
        run: python -u fetch_onchain.py
      - name: Publier le fichier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mvrv.json
          git diff --staged --quiet || (git commit -m "Mise à jour on-chain" && git pull --rebase && git push)
