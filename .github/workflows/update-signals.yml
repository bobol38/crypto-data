name: Mise à jour des signaux
on:
  schedule:
    - cron: "10 0,12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcul des signaux
        run: python -u fetch_signals.py
      - name: Publier le fichier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git diff --staged --quiet || (git commit -m "Mise à jour des signaux" && git pull --rebase && git push)
 
